
name: Build and Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Rename Windows executable
        shell: pwsh
        run: |
          Copy-Item `
            "target/release/wreckers_app.exe" `
            "Wreckers-Radio-Windows.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: wreckers-radio-windows
          path: Wreckers-Radio-Windows.exe


  # ============================================================
  # MACOS
  # ============================================================

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Create macOS app bundle
        shell: bash
        run: |
          APP_DIR="Wreckers Radio.app"

          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp \
            target/release/wreckers_app \
            "$APP_DIR/Contents/MacOS/wreckers-radio"

          cat > "$APP_DIR/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
              "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Wreckers Radio</string>

              <key>CFBundleDisplayName</key>
              <string>Wreckers Radio</string>

              <key>CFBundleIdentifier</key>
              <string>uk.wreckersradio.desktop</string>

              <key>CFBundleVersion</key>
              <string>1.0.0</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleExecutable</key>
              <string>wreckers-radio</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>

              <key>NSHighResolutionCapable</key>
              <true/>

              <key>LSUIElement</key>
              <false/>
          </dict>
          </plist>
          EOF

          chmod +x "$APP_DIR/Contents/MacOS/wreckers-radio"

      - name: Zip macOS app
        run: |
          zip -r "Wreckers-Radio-macOS.zip" "Wreckers Radio.app"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: wreckers-radio-macos
          path: Wreckers-Radio-macOS.zip


  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2

      - name: Build
        run: cargo build --release

      # --------------------------------------------------------
      # Standalone Linux binary
      # --------------------------------------------------------

      - name: Package Linux binary
        run: |
          mkdir -p linux-package

          cp \
            target/release/wreckers_app \
            linux-package/wreckers-radio

          chmod +x \
            linux-package/wreckers-radio

          tar -czf \
            Wreckers-Radio-Linux-x86_64.tar.gz \
            -C linux-package \
            wreckers-radio

      # --------------------------------------------------------
      # AppImage
      # --------------------------------------------------------

      - name: Download appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

      - name: Create AppImage structure
        run: |
          mkdir -p WreckersRadio.AppDir/usr/bin
          mkdir -p WreckersRadio.AppDir/usr/share/applications

          cp \
            target/release/wreckers_app \
            WreckersRadio.AppDir/usr/bin/wreckers-radio

          chmod +x \
            WreckersRadio.AppDir/usr/bin/wreckers-radio

          cat > WreckersRadio.AppDir/wreckers-radio.desktop <<'EOF'
          [Desktop Entry]
          Name=Wreckers Radio
          Comment=Wreckers Radio desktop player
          Exec=wreckers-radio
          Icon=wreckers-radio
          Terminal=false
          Type=Application
          Categories=Audio;Player;AudioVideo;
          EOF

          cp \
            WreckersRadio.AppDir/wreckers-radio.desktop \
            WreckersRadio.AppDir/usr/share/applications/

          python3 - <<'PY'
          import struct
          import zlib

          width = height = 1
          raw = b'\x00\x00\x00\x00'

          def chunk(name, data):
              return (
                  struct.pack(">I", len(data))
                  + name
                  + data
                  + struct.pack(">I", zlib.crc32(name + data) & 0xffffffff)
              )

          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(
                  b'IHDR',
                  struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              )
              + chunk(b'IDAT', zlib.compress(raw))
              + chunk(b'IEND', b'')
          )

          with open(
              'WreckersRadio.AppDir/wreckers-radio.png',
              'wb'
          ) as f:
              f.write(png)
          PY

      - name: Build AppImage
        run: |
          ARCH=x86_64 \
            ./appimagetool \
            WreckersRadio.AppDir \
            Wreckers-Radio-Linux-x86_64.AppImage

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: wreckers-radio-linux-binary
          path: Wreckers-Radio-Linux-x86_64.tar.gz

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: wreckers-radio-linux-appimage
          path: Wreckers-Radio-Linux-x86_64.AppImage


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - windows
      - macos
      - linux

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files

          find artifacts \
            -type f \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Wreckers Radio ${{ github.ref_name }}
          files: release-files/*
          generate_release_notes: true

